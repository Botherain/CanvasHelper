name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Windows runner 默认 cp1252，中文输出会炸；脚本内也已 reconfigure，双保险
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 静态检查 · ruff + mypy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (含 dev extra)
        # 顺带验证 pyproject 里的 dev extra 能解析
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check canvas_helper tests

      - name: Mypy
        run: python -m mypy

  smoke:
    name: 离线自检 · Python ${{ matrix.python }}
    # 本项目面向 Windows（DeskBox / 计划任务 / 资源管理器），故在 windows 上跑
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (via pyproject.toml)
        # 用可编辑安装而非 requirements.txt —— 每次推送都顺带证明打包配置没坏
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify packaging
        run: |
          python -m canvas_helper --version
          canvas-helper --version
          python -c 'import canvas_helper, canvas_helper.runner, canvas_helper.gui; print(canvas_helper.__file__)'

      - name: Byte-compile
        run: python -m compileall -q canvas_helper tests

      - name: Run offline self-test
        # smoke.py 与本机数据解耦：没有真实课程目录 / todo.json 时自动造 fixture，
        # 因此在干净的 runner 上也应当全绿。
        run: python tests/smoke.py

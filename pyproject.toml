[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas-helper"
# 与 canvas_helper/__init__.py 的 __version__ 保持一致（自检 [9] 会断言）
version = "1.2.0"
description = "Canvas 课程内容同步与学习辅助：按既有目录规则归档课程文件，把截止时间写入 DeskBox 待办"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Botherain" }]
keywords = ["canvas", "lms", "sync", "deskbox", "tkinter", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Utilities",
]
dependencies = [
    # 下限取 1.49 而不是最新：playwright 从 1.61 起要求 Python >= 3.10，而本项目
    # 地板是 3.9。写成 >=1.49 后交给 pip 解析——3.9 的机器会自动落到 1.60（最后
    # 一个还支持 3.9 的版本），3.10+ 照旧拿最新。两边的 API（持久化上下文 /
    # channel / context.request / cookies）都够老，不存在版本差异。
    "playwright>=1.49",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Pillow 只给 scripts/make_icon.py 用，放进来是为了让 CI 的 mypy 也能解析 PIL——
# 否则 lint 任务会在 scripts/make_icon.py 上报 import-not-found（实测踩过）。
# 它只是可选依赖，项目**运行时**依旧是零依赖。
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pillow>=10",
]

[project.scripts]
canvas-helper = "canvas_helper.__main__:main"
canvas-helper-gui = "canvas_helper.gui:main"

[project.urls]
Homepage = "https://github.com/Botherain/CanvasHelper"
Repository = "https://github.com/Botherain/CanvasHelper"
Issues = "https://github.com/Botherain/CanvasHelper/issues"

[tool.setuptools]
packages = ["canvas_helper"]

# ---------------------------------------------------------------------------
# 静态检查（python -m ruff check . ；CI 每次推送都跑）
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
# 与 requires-python 一致：规则按 3.9 判，UP 族才不会把 3.9 不支持的写法当成「现代化」推给学生。
target-version = "py39"

[tool.ruff.lint]
# 只选「能真抓出问题」的族，不做无意义的风格争论
select = [
    "E", "W",     # pycodestyle
    "F",          # pyflakes：未用导入 / 未定义名字
    "I",          # import 排序
    "UP",         # pyupgrade（按 py311 现代化）
    "B",          # bugbear：常见真 bug
    "SIM",        # 可化简的写法
    "C4", "PIE", "PERF",
    "RUF",        # ruff 自家规则
    "FURB",       # 现代化等价写法
    "S",          # bandit：安全
    "PLW",        # 子进程 / 并发类告警
]
ignore = [
    # except Exception 是刻意的防御：单个附件、单个接口失败不应中断整轮同步，
    # 上层已按「errors 列表 + 退出码」的约定收集并上报，这里不要求逐个捕获。
    "BLE001",
    "S101",       # assert（自检脚本里有意义）
    "S603",       # subprocess 调用无法静态验证——命令与路径都来自自家配置
    "S607",       # 同上（可执行文件路径）
    "S606",       # os.startfile 同理：打开的链接/文件都来自配置或用户勾选。它正是
                  # 替代 `cmd /c start` 的写法——不派生进程就不会新开可见控制台
    "RUF001", "RUF002", "RUF003",   # 「含糊 Unicode」——本项目注释与用户文案全是中文，
                                     # 全角标点是有意的，不接受改写成半角
    "PLW0603",                       # global：logger 缓存与自检计数器就是为此而生
    "PERF203",    # 循环里的 try/except：单个附件/接口失败必须单独容错、不能中断整轮。
                  # 按 py311 判定时这条不提示（零开销异常），降到 py39 才出现——开销可接受。
    "RUF012",     # 可变类属性注解
    "E501",       # 行长交给 line-length + 人工判断，不做强制换行（会破坏中文注释可读性）
]

# ---------------------------------------------------------------------------
# 类型检查（python -m mypy ；CI 每次推送都跑，配置见 files）
# ---------------------------------------------------------------------------
[tool.mypy]
# 程序地板是 3.9（requires-python），但 mypy 自己已经不支持把 3.9 当目标
# （1.19 起下限 3.10），只能按最接近的 3.10 检查；3.9 的真实兼容性由 CI 的
# 「离线自检 · Python 3.9」job 实跑保证，不靠类型检查器。
python_version = "3.10"
files = ["canvas_helper", "tests", "scripts"]
show_error_codes = true
# 无注解的函数体也照样检查：本项目多数函数已带注解，未带的那几个恰恰是最容易
# 出类型错的地方（实测这一开就抓出 3 个真的赋值不兼容）
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true
# 刻意**不开** warn_unused_ignores：gui.py 有 4 处 `# type: ignore[call-overload]`
# 是在补 typeshed 对 Treeview.column 重载的缺口（anchor 从元组推断成 str，
# 而重载要求 Literal）。mypy 升级后它们若变成「多余」，会把本来没错的代码判红；
# 取 CI 稳定性，不取这点洁癖。

[[tool.mypy.overrides]]
module = "tests.*"
# 自检脚本大量用鸭子类型替身（_Stub / _DeadSession）冒充 CanvasSession，这正是
# 「离线跑、不依赖真实 Playwright」的设计前提；给替身硬套类型层次只会造假。
# tests 仍受 ruff 约束（E/F/I/UP/B/SIM/PERF… 全绿），功能由 180 项断言保证。
ignore_errors = true

# ---------------------------------------------------------------------------
# pytest（python -m pytest ；CI 每次推送都跑）
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# smoke.py 是「实现 + 脚本入口」，由 test_smoke 按小节调用，不要被直接收集
python_files = ["test_*.py"]
addopts = "-ra"
